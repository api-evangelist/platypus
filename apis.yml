description: Platypus is a Danish HR-technology company (a Speedinvest portfolio company, invested
  2019) that built a talent lifecycle management solution for HR managers. Its people-analytics product
  helped HR professionals measure what employees value at every stage of the talent lifecycle - from
  attraction through management to retention - using a value-centric approach to company culture built
  on 12 work-related values across 3 core areas of organizational culture, surfacing individual needs
  and priorities while protecting employee anonymity. No public API, developer portal, OpenAPI, or other
  machine-readable API surface was found during enrichment; the company's former domains (getplatypus.com,
  platypus.ai) are now parked / listed for sale, indicating the product appears to be inactive/defunct.
